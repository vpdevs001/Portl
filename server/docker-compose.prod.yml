# Production stack — Postgres + Server + Caddy (TLS termination).
#
# Database: self-hosted Postgres in this same compose stack, persisted in the
# named volume below. The server image runs `drizzle-kit migrate` on boot
# (see Dockerfile), so the schema is always up-to-date before the API starts
# listening — it waits for Postgres to report healthy first.
#
#   cp .env.example .env   # fill in real secrets
#   bun run docker:prod    # build & start everything

services:
  postgres:
    image: postgres:17-alpine
    container_name: portl-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portl}
      POSTGRES_DB: ${POSTGRES_DB:-portl}
    volumes:
      - portl-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    container_name: portl-server
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Overrides whatever DATABASE_URL is set to in .env, pointing at the
      # `postgres` service on the internal compose network instead.
      DATABASE_URL: postgresql://${POSTGRES_USER:-portl}:${POSTGRES_PASSWORD:-portl}@postgres:5432/${POSTGRES_DB:-portl}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: portl-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - portl-caddy-data:/data
      - portl-caddy-config:/config
    environment:
      # Caddyfile proxies to {$UPSTREAM} — server:8000 inside the network.
      UPSTREAM: server:8000
    depends_on:
      - server

volumes:
  portl-pgdata:
  portl-caddy-data:
  portl-caddy-config: